<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-labelledby="title desc"><title id="title">Original fictional case A: collect, review, record</title><desc id="desc">EX-A collect points to EX-B review. EX-B review points to EX-C record. The two arrows show only the declared sequence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#234f72"/></marker></defs><g fill="#eef3f5" stroke="#234f72" stroke-width="2"><rect id="EX-A" x="20" y="40" width="220" height="90" rx="8"/><rect id="EX-B" x="340" y="40" width="220" height="90" rx="8"/><rect id="EX-C" x="660" y="40" width="220" height="90" rx="8"/></g><g stroke="#234f72" stroke-width="3" marker-end="url(#arrow)"><path id="A-B" d="M240,85 H330"/><path id="B-C" d="M560,85 H650"/></g><g fill="#202830" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle"><text x="130" y="80">EX-A</text><text x="130" y="110">collect</text><text x="450" y="80">EX-B</text><text x="450" y="110">review</text><text x="770" y="80">EX-C</text><text x="770" y="110">record</text></g></svg>