name: Apply SEO Updates
on:
  workflow_dispatch:

jobs:
  apply-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run SEO update script
        run: python apply_seo.py
      - name: Commit and push
        run: |
          git config user.name "Dr. Connor Robertson"
          git config user.email "dr.connor.robertson@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "SEO: Person schema, FAQ schema, meta tags, llms.md, sitemap, robots.txt"
          git push
